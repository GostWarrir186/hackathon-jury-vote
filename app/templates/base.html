<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}{{ EVENT_TITLE }}{% endblock %}</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14212b;--muted:#64748b;--line:#e2e8f0;--acc:#0b6e4f;--acc2:#e8f5ef;--warn:#b45309;--warnbg:#fef3c7;--err:#b91c1c;--errbg:#fee2e2}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
 padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.wide{max-width:1200px}
header.top{background:var(--acc);color:#fff}
header.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:12px;padding-bottom:12px}
header.top a{color:#fff}
h1{font-size:1.35rem;margin:.2em 0 .6em}h2{font-size:1.1rem;margin:1.2em 0 .5em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.muted{color:var(--muted);font-size:.9rem}
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;
 background:var(--acc);color:#fff;text-decoration:none;text-align:center}
.btn.sec{background:#fff;color:var(--acc);border:1px solid var(--acc)}
.btn.small{padding:6px 12px;font-size:.9rem}
.btn.red{background:var(--err)}
.btn.block{display:block;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:600}
.ok{background:var(--acc2);color:var(--acc)}.wait{background:#eef2f7;color:var(--muted)}
.warnp{background:var(--warnbg);color:var(--warn)}.errp{background:var(--errbg);color:var(--err)}
.alert{padding:12px 14px;border-radius:10px;margin:12px 0}
.alert.ok{background:var(--acc2)}.alert.warn{background:var(--warnbg);color:#7c2d12}.alert.err{background:var(--errbg);color:#7f1d1d}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.8rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.scroll{overflow-x:auto}
input[type=text],input[type=tel],input[type=number],input[type=password],textarea,select{
 font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff;color:var(--ink)}
textarea{min-height:70px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a{color:var(--acc)}
.center{text-align:center}
.pcard{transition:border-color .3s, box-shadow .3s, transform .3s;border:2px solid var(--line)}
.pcard.now{border-color:var(--acc);box-shadow:0 0 0 4px rgba(11,110,79,.15)}
.pcard.flash{animation:flash 1.2s ease 2}
@keyframes flash{0%,100%{box-shadow:0 0 0 4px rgba(11,110,79,.15)}50%{box-shadow:0 0 0 10px rgba(245,183,0,.45)}}
.nowpill{display:none}.pcard.now .nowpill{display:inline-block}
.live{display:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));font-size:.85rem;padding:6px 14px;border-radius:99px;
 background:var(--errbg);color:var(--err);font-weight:600;z-index:9;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.live.off{display:block}
.live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:6px;vertical-align:middle}
.live.off i{background:#ef4444}
.nowbar{display:none;position:sticky;top:0;z-index:5;background:var(--warnbg);color:#7c2d12;padding:10px 14px;border-radius:10px;margin:8px 0;text-decoration:none}
.nowbar.show{display:block;animation:flash 1.2s ease 1}
.hide{display:none}
.eye{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;
 font:600 .85rem system-ui,sans-serif;color:var(--acc);cursor:pointer;vertical-align:middle}
.eye svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eye .on{display:none}.eye.masked-eye .on{display:inline}.eye.masked-eye .off{display:none}
.masked .sv{filter:blur(7px);user-select:none;pointer-events:none}
.masked .sv-hide{display:none}
</style>
<script>
window.liveState=function(cb){
  let el=null,fails=0;
  async function tick(){
    try{const r=await fetch('{{ P }}/api/state',{cache:'no-store'});if(!r.ok)throw 0;
      const st=await r.json();fails=0;if(el)el.className='live',el.lastChild.textContent='онлайн';cb(st);}
    catch(e){if(++fails>=2&&el)el.className='live off',el.lastChild.textContent='Нет связи — проверьте интернет';}
  }
  document.addEventListener('DOMContentLoaded',()=>{el=document.createElement('div');el.className='live';
    el.innerHTML='<i></i><span>онлайн</span>';document.body.appendChild(el);});
  tick();setInterval(tick,2000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
};
</script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 document.querySelectorAll('.eye').forEach(btn=>{
  const id=btn.dataset.target, box=document.getElementById(id); if(!box)return;
  const tb=box.querySelector('tbody[data-sort]'), key='eye_'+location.pathname+'_'+id;
  function apply(show){
    box.classList.toggle('masked',!show); btn.classList.toggle('masked-eye',!show);
    btn.querySelector('span').textContent=show?'Скрыть':'Показать';
    if(tb){
      [...tb.rows].sort((a,b)=>show?a.dataset.rank-b.dataset.rank:a.dataset.num-b.dataset.num).forEach(r=>tb.appendChild(r));}
  }
  let show=false; try{show=localStorage.getItem(key)==='1'}catch(e){}
  apply(show);
  btn.addEventListener('click',()=>{show=!show;try{localStorage.setItem(key,show?'1':'0')}catch(e){}apply(show);});
 });
});
</script>
{% block head %}{% endblock %}
</head>
<body>
<header class="top"><div class="wrap {% block wrapclass %}{% endblock %}"><strong>{{ EVENT_TITLE }}</strong><span>{% block nav %}{% endblock %}</span></div></header>
<main class="wrap {{ self.wrapclass() }}">{% block body %}{% endblock %}</main>

</body></html>
